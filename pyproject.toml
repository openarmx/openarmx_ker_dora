[project]
name = "openarmx-ker-dora"
version = "0.1.0"
description = "ROS-independent KER protocol library and future Dora teleoperation nodes"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dora-rs==0.5.0",
  "numpy>=1.26,<3",
  "pyarrow>=14,<22",
  "pyusb>=1.2,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openarmx_ker_dora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
